<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechShortsApp — V2 in Development</title>
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #e6e8eb;
        --muted: #9aa4b2;
        --accent: #4f8cff;
        --card: #121826;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Inter, Helvetica, Arial, sans-serif;
        background: radial-gradient(
          1200px 600px at 50% -10%,
          #162036,
          var(--bg)
        );
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.6;
      }

      .container {
        max-width: 720px;
        padding: 48px 40px;
        background: rgba(18, 24, 38, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
        text-align: center;
        backdrop-filter: blur(6px);
      }

      h1 {
        font-size: 2.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }

      h1 span {
        color: var(--accent);
      }

      .tagline {
        font-size: 1.1rem;
        color: var(--muted);
        margin-bottom: 28px;
      }

      .divider {
        width: 64px;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        margin: 24px auto;
        opacity: 0.8;
      }

      .message {
        font-size: 1rem;
        color: #cfd6e4;
        margin-bottom: 36px;
      }

      .pill {
        display: inline-block;
        padding: 8px 14px;
        font-size: 0.85rem;
        border-radius: 999px;
        background: rgba(79, 140, 255, 0.12);
        color: var(--accent);
        border: 1px solid rgba(79, 140, 255, 0.25);
        margin-bottom: 20px;
      }

      footer {
        margin-top: 32px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      footer span {
        color: #cfd6e4;
      }

      @media (max-width: 600px) {
        .container {
          padding: 36px 24px;
        }

        h1 {
          font-size: 2.1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="pill">V2 in development</div>

      <h1>TechShorts<span>App</span></h1>
      <p class="tagline">
        Short technical insights, ranked by accuracy — not noise.
      </p>

      <div class="divider"></div>

      <p class="message">
        We’re rebuilding TechShortsApp quietly and deliberately.
      </p>

      <footer>
        <span>See you in the next chapter.</span><br />
        Thank you for your patience and support.
      </footer>
    </main>
  </body>
</html>
